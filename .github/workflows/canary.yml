name: Canary

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cgl:
    uses: konradmichalik/reusable-github-actions/.github/workflows/cgl.yml@main
    permissions:
      contents: read

  cgl-test:
    uses: konradmichalik/reusable-github-actions/.github/workflows/cgl-test.yml@main
    permissions:
      contents: read

  tests-php:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-php.yml@main
    permissions:
      contents: read
    with:
      # 8.1 excluded: this package also requires typo3/cms-core, which
      # (together with phpunit ^11) needs PHP >=8.2. A real tests-php.yml
      # consumer is a pure PHP library without that constraint and keeps
      # the full default matrix; this canary cannot represent both a pure
      # PHP library and a TYPO3 extension in the same composer.json.
      php-versions: '["8.2", "8.3", "8.4"]'

  tests-typo3:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      typo3-versions: '["12.4"]'
      dependencies: '["highest"]'

  security:
    uses: konradmichalik/reusable-github-actions/.github/workflows/security.yml@main
    permissions:
      contents: read

  scorecard:
    uses: konradmichalik/reusable-github-actions/.github/workflows/scorecard.yml@main
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
