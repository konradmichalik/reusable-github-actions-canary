name: Canary

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cgl:
    uses: konradmichalik/reusable-github-actions/.github/workflows/cgl.yml@main
    permissions:
      contents: read

  cgl-test:
    uses: konradmichalik/reusable-github-actions/.github/workflows/cgl-test.yml@main
    permissions:
      contents: read

  tests-php:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-php.yml@main
    permissions:
      contents: read

  tests-typo3:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      typo3-versions: '["12.4"]'
      dependencies: '["highest"]'

  tests-deprecated:
    name: tests.yml (deprecated, see #39)
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      typo3-versions: '["12.4"]'
      dependencies: '["highest"]'

  security:
    uses: konradmichalik/reusable-github-actions/.github/workflows/security.yml@main
    permissions:
      contents: read

  scorecard:
    uses: konradmichalik/reusable-github-actions/.github/workflows/scorecard.yml@main
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
